apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: default
  labels:
    app.kubernetes.io/managed-by: Helm
spec:
  template:
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: default
      expireAfter: {{ .Values.expireAfter | quote }}
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values:
            {{- range .Values.capacityTypes }}
            - {{ . | quote }}
            {{- end }}
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values:
            {{- range .Values.instanceCategories }}
            - {{ . | quote }}
            {{- end }}
        - key: karpenter.k8s.aws/instance-generation
          operator: Gt
          values: ["2"]
  limits:
    cpu: {{ .Values.limits.cpu | quote }}
    memory: {{ .Values.limits.memory | quote }}
  disruption:
    consolidationPolicy: {{ .Values.disruption.consolidationPolicy | quote }}
    consolidateAfter: {{ .Values.disruption.consolidateAfter | quote }}
