apiVersion: v1
kind: Namespace
metadata:
  name: edge
  labels:
    app.kubernetes.io/part-of: k3s-edge-demo
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  namespace: edge
  labels:
    app.kubernetes.io/name: hello
    app.kubernetes.io/part-of: k3s-edge-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hello
      app.kubernetes.io/part-of: k3s-edge-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hello
        app.kubernetes.io/part-of: k3s-edge-demo
    spec:
      automountServiceAccountToken: false
      containers:
        - name: hello
          image: nginxdemos/hello:0.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: hello
  namespace: edge
  labels:
    app.kubernetes.io/name: hello
    app.kubernetes.io/part-of: k3s-edge-demo
spec:
  # ServiceLB (Klipper) is still enabled; this is reachable on the node IP
  # even with Traefik disabled. See clusters/k3s/README.md.
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: hello
    app.kubernetes.io/part-of: k3s-edge-demo
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello
  namespace: edge
  labels:
    app.kubernetes.io/name: hello
    app.kubernetes.io/part-of: k3s-edge-demo
spec:
  # Bundled Traefik is disabled on purpose. Install a controller (Traefik Helm
  # is the usual k3s choice; ingress-nginx retired in March 2026) and this
  # object will start routing. Until then the LoadBalancer Service above works.
  ingressClassName: traefik
  rules:
    - host: hello.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hello
                port:
                  name: http
