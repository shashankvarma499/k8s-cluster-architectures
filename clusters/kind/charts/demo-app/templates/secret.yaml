# EXAMPLE VALUES come from values.yaml (secret.apiToken / secret.demoPassword).
apiVersion: v1
kind: Secret
metadata:
  name: demo-secrets
  labels:
    {{- include "demo-app.labels" . | nindent 4 }}
    app.kubernetes.io/name: demo-app
type: Opaque
stringData:
  api-token: {{ .Values.secret.apiToken | quote }}
  demo-password: {{ .Values.secret.demoPassword | quote }}
