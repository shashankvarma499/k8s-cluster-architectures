# Concrete playground defaults. Change secret.* before any shared use.

nameOverride: ""
fullnameOverride: ""

ingressClassName: nginx
ingressHost: localhost

config:
  APP_ENV: playground
  LOG_LEVEL: info
  ECHO_TEXT: "demo-api from ConfigMap"
  WELCOME: "kind playground"

# EXAMPLE VALUES — dummy credentials, not for production.
secret:
  apiToken: "demo-not-for-production-token"
  demoPassword: "demo-pass-change-me"

web:
  replicaCount: 2
  image:
    repository: nginxdemos/hello
    tag: "0.4"
    pullPolicy: IfNotPresent
  service:
    port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80

api:
  replicaCount: 1
  image:
    repository: hashicorp/http-echo
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    port: 8080
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi

networkPolicy:
  enabled: true
  ingressNginxNamespace: ingress-nginx
