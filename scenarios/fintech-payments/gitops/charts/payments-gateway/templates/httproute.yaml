apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: payments
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
spec:
  gatewayClassName: cilium
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: pay.northstar.example
      tls:
        mode: Terminate
        certificateRefs:
          - name: payments-gateway-tls
            kind: Secret
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.name }}
  labels:
    app.kubernetes.io/name: {{ .Values.name }}
spec:
  parentRefs:
    - name: payments
  hostnames:
    - pay.northstar.example
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Values.name }}
          port: {{ .Values.service.port }}
