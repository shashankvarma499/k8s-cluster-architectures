name: webhook-dispatcher
replicaCount: 2
image:
  repository: public.ecr.aws/docker/library/nginx
  tag: "1.27-alpine"
  pullPolicy: IfNotPresent
service:
  port: 8080
  targetPort: 80
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
podSecurity:
  runAsUser: 101
  runAsGroup: 101
  fsGroup: 101
