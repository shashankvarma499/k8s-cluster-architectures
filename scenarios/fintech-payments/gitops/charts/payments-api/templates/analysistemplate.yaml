apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: {{ .Values.name }}-success-rate
spec:
  metrics:
    - name: success-rate
      interval: 1m
      count: 5
      successCondition: result[0] >= 0.99
      failureLimit: 3
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.observability.svc:9090
          query: |
            sum(rate(http_requests_total{service="payments-api",status!~"5.."}[5m]))
            /
            sum(rate(http_requests_total{service="payments-api"}[5m]))
