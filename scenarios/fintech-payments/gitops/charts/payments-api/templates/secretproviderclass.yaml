apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.name }}-vault
spec:
  provider: vault
  parameters:
    roleName: payments-api
    objects: |
      - objectName: "ledger-dek"
        secretPath: "cde/data/payments-api"
        secretKey: "ledger_dek"
