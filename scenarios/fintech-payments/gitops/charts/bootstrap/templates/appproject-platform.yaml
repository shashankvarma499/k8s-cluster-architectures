apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
spec:
  description: Platform and out-of-CDE applications
  sourceRepos:
    - {{ .Values.repoURL | quote }}
  destinations:
    - namespace: "*"
      server: {{ .Values.destinationServer | quote }}
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
